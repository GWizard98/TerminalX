[agent]
server_name = "tradeco-droplet"
poll_interval_secs = 30

[monitors.ssh]
enabled = true
auth_log_path = "/var/log/auth.log"
fail_threshold = 5

[monitors.filesystem]
enabled = true
watch_paths = [
    "/root/TradeEco",
    "/etc/cyberguardian",
]
ignore_extensions = ["log"]

[monitors.process]
enabled = true
whitelist = [
    "cyberguardian",
    "sshd",
    "systemd",
    "systemd-journald",
    "systemd-udevd",
    "systemd-networkd",
    "systemd-resolved",
    "systemd-timesyncd",
    "journald",
    "cron",
    "ntpd",
    "rsyslogd",
    "fail2ban",
    "f2b/observer",
    "python3",
    "twistd",
    "cowrie",
    "wg",
    "napi/wg0-0",
    "droplet-agent",
    "multipathd",
    "polkitd",
    "udisksd",
    "ModemManager",
    "systemctl",
    "flask",
    "gunicorn",
    "agetty",
    "login",
    "bash",
    "sh",
    "ps",
    "grep",
    "tail",
    "cat",
    "journalctl",
    "kworker",
    "kthreadd",
    "ksoftirqd",
    "migration",
    "rcu_sched",
    "netfilter-persistent",
    "dbus-daemon",
    "unattended-upgrades",
    "gmain",
    "sd-resolve", 
    "gdbus",
    "unattended-upgr",
    "(sd-pam)",
    "pool-spawner",
    "notify-rs inoti",
    "tokio-rt-worker",
    "cleanup",
    "in:imklog",
    "in:imuxsock",
    "rs:main Q:Reg",
] 

[monitors.network]
enabled = true
allowed_destinations = [
    "api-fxtrade.oanda.com",
    "stream-fxtrade.oanda.com",
    "ntfy.sh",
]
alert_ports = [4444, 1337, 8080, 31337, 6666, 9999]

[monitors.integrity]
enabled = true
watch_paths = ["/root/TradeEco"]
ignore_extensions = ["log"]
poll_interval_secs = 60

[monitors.cowrie]
enabled = true
log_path = "/home/cowrie/cowrie/var/log/cowrie/cowrie.json"

[notifycore]
bot_token = "8667300067:AAGwnBSYoa9j7Ts1JINRWj07bAfwPWsbjcQ"
chat_id = "8691529662"
min_severity = "warning"

[vpn]
enabled = false
default_security_level = "professional"
auto_upgrade_threshold = 0.6

[vpn.kill_switch]
enabled = false
tunnel_interface = "wg0"
bypass_ips = []

[[vpn.servers]]
address = ""
location = ""
jurisdiction = ""
trust_score = 0.0

[active_response]
enabled = true
auto_block_threshold = 0.80
escalate_threshold = 1.00
ip_whitelist = ["172.58.135.186"]
known_abuse_asns = ["AS51396", "AS47890"]
bulletproof_keywords = ["UNMANAGED", "bulletproof", "offshore"]
evidence_log_path = "/var/log/cyberguardian/evidence.jsonl"